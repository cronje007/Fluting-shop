<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fluting Dashboard</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="fluting">
  <header class="site-header">
    <div class="header-brand">
      <img src="MSS.svg" alt="MSS logo" class="logo" />
      <div>
        <h1>Fluting</h1>
        <p class="subtitle">Accept specs and complete fluting tasks</p>
      </div>
    </div>
  </header>

  <main>
    <section class="card">
      <h2>Queue</h2>
      <div class="panel">
        <ul class="roll-list" id="fluting-queue"></ul>
        <label>Scan Roll ID <input id="fluting-scan" /></label>
        <p class="specs" id="fluting-specs">Fluting specs appear here.</p>
        <button class="danger" id="fluting-accept">ACCEPT</button>
        <button id="fluting-done">Roll Done</button>
      </div>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
