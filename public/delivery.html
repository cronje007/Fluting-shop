<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Delivery Dashboard</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="delivery">
  <header class="site-header">
    <div class="header-brand">
      <img src="MSS.svg" alt="MSS logo" class="logo" />
      <div>
        <h1>Delivery</h1>
        <p class="subtitle">Track and finalize roll deliveries</p>
      </div>
    </div>
  </header>

  <main>
    <section class="card">
      <h2>Delivery Queue</h2>
      <div class="panel">
        <div id="delivery-queue"></div>
      </div>
    </section>

    <section class="card">
      <h2>Ready for Delivery</h2>
      <div class="panel">
        <label>Scan Roll ID <input id="delivery-scan" /></label>
        <button id="delivery-done">Mark Delivered</button>
      </div>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
