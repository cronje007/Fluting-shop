<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Frosting Dashboard</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="frosting">
  <header class="site-header">
    <div class="header-brand">
      <img src="MSS.svg" alt="MSS logo" class="logo" />
      <div>
        <h1>Frosting</h1>
        <p class="subtitle">Accept specs and complete frosting tasks</p>
      </div>
    </div>
  </header>

  <main>
    <section class="card">
      <h2>Queue</h2>
      <div class="panel">
        <label>Scan Roll ID <input id="frosting-scan" /></label>
        <p class="specs" id="frosting-specs">Frosting specs appear here.</p>
        <button class="danger" id="frosting-accept">ACCEPT</button>
        <button id="frosting-done">Roll Done</button>
      </div>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
